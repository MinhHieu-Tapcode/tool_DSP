name: GIP 287 Auto

on:
  schedule:
    # UTC -> UTC+7 (VN): 08:45, 11:45, 14:45 and 15:05 cut-off sweep
    - cron: "45 1,4,7 * * *"
    - cron: "5 8 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Chế độ chạy (dry-run để test chỉ đọc, apply để chạy thật)"
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run
      no_cancel:
        description: "Chỉ gắn tag (KHÔNG tự hủy đơn TEST / DUPLICATE)"
        type: boolean
        default: true
      concurrency:
        description: "Số tab tra SĐT song song"
        type: string
        default: "4"

concurrency:
  group: gsolution-gip287
  cancel-in-progress: false

jobs:
  run-gip287:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium for Playwright
        run: python -m playwright install chromium --with-deps

      - name: Run unit tests
        run: python -m unittest discover -s . -v

      - name: Run GIP 287 pipeline
        env:
          GSOLUTION_EMAIL: ${{ secrets.GSOLUTION_EMAIL }}
          GSOLUTION_PASSWORD: ${{ secrets.GSOLUTION_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${GSOLUTION_EMAIL:-}" ] || [ -z "${GSOLUTION_PASSWORD:-}" ]; then
            echo "::error::Thiếu Secrets GSOLUTION_EMAIL hoặc GSOLUTION_PASSWORD trong Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          args=(--mode gip287 --concurrency "${{ inputs.concurrency || '4' }}")
          if [ "${{ github.event_name }}" = "schedule" ]; then
            args+=(--apply --no-cancel)
          else
            if [ "${{ inputs.mode }}" = "apply" ]; then
              args+=(--apply)
            else
              args+=(--dry-run)
            fi
            if [ "${{ inputs.no_cancel }}" = "true" ]; then
              args+=(--no-cancel)
            fi
          fi

          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            args+=(--notify-telegram)
          fi

          python run.py "${args[@]}"

      - name: Upload Excel, JSON & Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gip287-report-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            reports/
            logs/
          retention-days: 14
          if-no-files-found: warn
