<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bảng Điều Khiển Tool DSP — GSolution Auto</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --green: #16a34a;
      --green-bg: #dcfce7;
      --green-text: #15803d;
      --red: #dc2626;
      --red-bg: #fee2e2;
      --red-text: #b91c1c;
      --amber: #d97706;
      --amber-bg: #fef3c7;
      --amber-text: #b45309;
      --blue-bg: #dbeafe;
      --blue-text: #1d4ed8;
      --slate-bg: #f1f5f9;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    .hidden { display: none !important; }
    .wrap { max-width: 1260px; margin: 0 auto; padding: 18px 16px 40px; }

    /* Login */
    .login-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      padding: 28px;
    }
    .login-card h1 { margin: 0 0 6px; font-size: 21px; }
    .login-card p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }

    /* Header */
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }
    .brand { display: flex; flex-direction: column; gap: 2px; }
    .brand h1 { margin: 0; font-size: 19px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .brand .sub { font-size: 13px; color: var(--muted); }
    .top-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .clock-pill {
      font-size: 12.5px;
      color: #334155;
      background: var(--slate-bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      font-weight: 500;
    }

    /* Buttons & Inputs */
    button, .btn {
      font: inherit;
      cursor: pointer;
      border: 1px solid transparent;
      border-radius: 9px;
      padding: 8px 13px;
      font-size: 13.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s, border-color 0.15s, opacity 0.15s;
      text-decoration: none;
    }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-success { background: var(--green); color: #fff; }
    .btn-success:hover:not(:disabled) { background: #15803d; }
    .btn-danger { background: var(--red); color: #fff; }
    .btn-danger:hover:not(:disabled) { background: #b91c1c; }
    .btn-ghost { background: #fff; color: var(--text); border-color: var(--border); }
    .btn-ghost:hover:not(:disabled) { background: #f8fafc; border-color: #cbd5e1; }
    .btn-sm { padding: 5px 10px; font-size: 12.5px; border-radius: 7px; }
    .btn-xs { padding: 3px 8px; font-size: 12px; border-radius: 6px; }

    label.field-label { display: block; font-size: 12.5px; font-weight: 600; color: #334155; margin-bottom: 5px; }
    input[type="text"], input[type="password"], select {
      width: 100%;
      font: inherit;
      font-size: 13.5px;
      padding: 8px 11px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      background: #fff;
      color: var(--text);
      outline: none;
    }
    input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    @media (max-width: 980px) {
      .grid { grid-template-columns: 1fr; }
    }

    /* Tool Card */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .card-head {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      background: #fafcff;
    }
    .card-title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .card-head h2 { margin: 0; font-size: 17px; }
    .card-desc { margin: 4px 0 0; font-size: 12.5px; color: var(--muted); }
    .sched-line { margin-top: 6px; font-size: 12.5px; color: #334155; font-weight: 500; }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .pill-green { background: var(--green-bg); color: var(--green-text); }
    .pill-red { background: var(--red-bg); color: var(--red-text); }
    .pill-amber { background: var(--amber-bg); color: var(--amber-text); }
    .pill-blue { background: var(--blue-bg); color: var(--blue-text); }
    .pill-slate { background: var(--slate-bg); color: #475569; }

    .run-box {
      padding: 15px 18px;
      border-bottom: 1px solid var(--border);
      background: #fff;
    }
    .run-box-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: #475569;
      margin: 0 0 10px;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    @media (max-width: 540px) { .form-row { grid-template-columns: 1fr; } }

    .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .chip {
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #334155;
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .chip:hover { background: #e2e8f0; }

    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      margin: 8px 0 12px;
      color: #1e293b;
      user-select: none;
    }
    .check-row input { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }

    /* History Table */
    .history-wrap { padding: 14px 18px 18px; }
    .history-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .history-head h3 { margin: 0; font-size: 14px; color: #334155; }
    .run-list { display: flex; flex-direction: column; gap: 9px; }
    .run-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      background: #fcfdff;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .run-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .run-meta {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      font-size: 12.5px;
      color: var(--muted);
    }
    .run-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .step-hint {
      font-size: 12px;
      color: var(--blue-text);
      background: #eff6ff;
      border-radius: 6px;
      padding: 4px 8px;
    }

    /* Alert / Toast */
    .alert {
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 13.5px;
      margin-bottom: 14px;
      border: 1px solid transparent;
    }
    .alert-err { background: var(--red-bg); color: var(--red-text); border-color: #fecaca; }
    .alert-ok { background: var(--green-bg); color: var(--green-text); border-color: #bbf7d0; }
    .alert-warn { background: var(--amber-bg); color: var(--amber-text); border-color: #fde68a; }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    .modal {
      width: 100%;
      max-width: 860px;
      max-height: 86vh;
      background: var(--card);
      border-radius: 14px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.25);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-head {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .modal-head h3 { margin: 0; font-size: 15.5px; }
    .log-pre {
      margin: 0;
      padding: 14px 16px;
      background: #0f172a;
      color: #e2e8f0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.5;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      flex: 1;
      min-height: 280px;
    }
    .dot-spin {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      display: inline-block;
      animation: pulse 1.1s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.15); }
    }
  </style>
</head>
<body>
  <!-- Login View -->
  <div id="loginView" class="login-shell">
    <div class="login-card">
      <h1>Tool DSP — GSolution Auto</h1>
      <p>Đăng nhập để bật/tắt lịch, bấm chạy tay và theo dõi báo cáo 2 luồng <strong>FILL IN DATA</strong> &amp; <strong>GIP 287</strong>.</p>
      <div id="envWarning" class="alert alert-warn hidden"></div>
      <div id="loginErr" class="alert alert-err hidden"></div>
      <form id="loginForm">
        <div style="margin-bottom: 14px;">
          <label class="field-label" for="pwInput">Mật khẩu điều khiển</label>
          <input id="pwInput" type="password" placeholder="Nhập mật khẩu..." autocomplete="current-password" required />
        </div>
        <button id="loginBtn" type="submit" class="btn-primary" style="width: 100%;">Đăng nhập</button>
      </form>
    </div>
  </div>

  <!-- Dashboard View -->
  <div id="appView" class="wrap hidden">
    <header class="topbar">
      <div class="brand">
        <h1>Bảng Điều Khiển Tool DSP</h1>
        <div class="sub">Điều khiển trực tiếp 2 tool online • Không cần mở GitHub • Tự động lưu file Excel</div>
      </div>
      <div class="top-actions">
        <span id="vnClock" class="clock-pill">Giờ VN: --:--</span>
        <span id="refreshPill" class="clock-pill">Tự cập nhật: 45s</span>
        <button id="refreshBtn" class="btn-ghost btn-sm" type="button">↻ Làm mới ngay</button>
        <button id="logoutBtn" class="btn-ghost btn-sm" type="button">Đăng xuất</button>
      </div>
    </header>

    <div id="toastBox" class="alert hidden"></div>

    <div id="cardsGrid" class="grid"></div>
  </div>

  <!-- Log Modal -->
  <div id="logModal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-head">
        <h3 id="logModalTitle">Chi tiết Log</h3>
        <div style="display:flex; gap:8px;">
          <button id="reloadLogBtn" class="btn-ghost btn-sm" type="button">↻ Tải lại log</button>
          <button id="closeLogBtn" class="btn-ghost btn-sm" type="button">Đóng ✕</button>
        </div>
      </div>
      <pre id="logPre" class="log-pre">Đang tải log...</pre>
    </div>
  </div>

  <script>
    const state = {
      data: null,
      loading: false,
      refreshTimer: null,
      activeLogRunId: null,
      activeLogTitle: "",
      busyAction: {},
    };

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function showToast(msg, kind = "ok") {
      const box = document.getElementById("toastBox");
      box.textContent = msg;
      box.className = "alert " + (kind === "err" ? "alert-err" : kind === "warn" ? "alert-warn" : "alert-ok");
      box.classList.remove("hidden");
      clearTimeout(box._t);
      box._t = setTimeout(() => box.classList.add("hidden"), 7000);
    }

    function formatVnTime(iso) {
      if (!iso) return "--";
      try {
        const d = new Date(iso);
        const hm = d.toLocaleTimeString("vi-VN", {
          timeZone: "Asia/Ho_Chi_Minh",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        });
        const dm = d.toLocaleDateString("vi-VN", {
          timeZone: "Asia/Ho_Chi_Minh",
          day: "2-digit",
          month: "2-digit",
        });
        return `${hm} ${dm}`;
      } catch {
        return iso;
      }
    }

    function formatDuration(sec) {
      if (sec === null || sec === undefined || Number.isNaN(sec)) return "--";
      if (sec < 60) return `${sec}s`;
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m}p ${s}s`;
    }

    function updateClock() {
      const el = document.getElementById("vnClock");
      const now = new Date();
      el.textContent =
        "Giờ VN: " +
        now.toLocaleString("vi-VN", {
          timeZone: "Asia/Ho_Chi_Minh",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          day: "2-digit",
          month: "2-digit",
          hour12: false,
        });
    }

    function statusBadge(run) {
      if (run.status === "queued" || run.status === "waiting" || run.status === "pending") {
        return `<span class="pill pill-amber"><span class="dot-spin"></span>Đang chờ khởi tạo</span>`;
      }
      if (run.status === "in_progress") {
        return `<span class="pill pill-blue"><span class="dot-spin"></span>Đang chạy</span>`;
      }
      if (run.conclusion === "success") {
        return `<span class="pill pill-green">✓ Thành công</span>`;
      }
      if (run.conclusion === "cancelled") {
        return `<span class="pill pill-slate">Đã dừng</span>`;
      }
      if (run.conclusion === "failure" || run.conclusion === "timed_out") {
        return `<span class="pill pill-red">✕ Lỗi (${escapeHtml(run.conclusion)})</span>`;
      }
      return `<span class="pill pill-slate">${escapeHtml(run.conclusion || run.status)}</span>`;
    }

    async function api(url, opts = {}) {
      const resp = await fetch(url, {
        headers: { "Content-Type": "application/json", ...(opts.headers || {}) },
        ...opts,
      });
      if (resp.status === 401 && url !== "/api/auth") {
        switchToLogin("Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại.");
        throw new Error("Unauthorized");
      }
      const data = await resp.json();
      if (!resp.ok || data.ok === false) {
        throw new Error(data.error || `Lỗi HTTP ${resp.status}`);
      }
      return data;
    }

    function switchToLogin(errText = "") {
      clearTimeout(state.refreshTimer);
      document.getElementById("appView").classList.add("hidden");
      document.getElementById("loginView").classList.remove("hidden");
      const errEl = document.getElementById("loginErr");
      if (errText) {
        errEl.textContent = errText;
        errEl.classList.remove("hidden");
      } else {
        errEl.classList.add("hidden");
      }
    }

    function switchToApp() {
      document.getElementById("loginView").classList.add("hidden");
      document.getElementById("appView").classList.remove("hidden");
    }

    function renderToolCard(tool) {
      const toggleBusy = Boolean(state.busyAction[`toggle_${tool.id}`]);
      const runBusy = Boolean(state.busyAction[`run_${tool.id}`]);
      const statusPill = tool.enabled
        ? `<span class="pill pill-green">● ĐANG BẬT LỊCH</span>`
        : `<span class="pill pill-red">■ ĐANG TẮT LỊCH</span>`;

      const toggleBtn = tool.enabled
        ? `<button class="btn-danger btn-sm" onclick="handleToggle('${tool.id}', false)" ${toggleBusy ? "disabled" : ""}>Tắt lịch tự động</button>`
        : `<button class="btn-success btn-sm" onclick="handleToggle('${tool.id}', true)" ${toggleBusy ? "disabled" : ""}>Bật lịch tự động</button>`;

      const controlsHtml =
        tool.id === "fillin"
          ? `
            <div class="form-row">
              <div>
                <label class="field-label" for="fillin_mode">Chế độ chạy</label>
                <select id="fillin_mode">
                  <option value="apply" selected>Chạy thật (--apply)</option>
                  <option value="dry-run">Chỉ đọc kiểm tra (--dry-run)</option>
                </select>
              </div>
              <div>
                <label class="field-label" for="fillin_sales">Ghi đè sale nhận đơn (tùy chọn)</label>
                <input id="fillin_sales" type="text" placeholder="Để trống = tự đọc Google Sheets" />
                <div class="chip-row">
                  <button type="button" class="chip" onclick="setSales('Frescadorado')">Chỉ Fresca</button>
                  <button type="button" class="chip" onclick="setSales('angie0987654321.gip@gmail.com')">Chỉ Angelica</button>
                  <button type="button" class="chip" onclick="setSales('')">Theo Google Sheets</button>
                </div>
              </div>
            </div>
            <label class="check-row">
              <input id="fillin_skip_step2" type="checkbox" />
              <span>Bỏ qua Bước 2 (không quét 3 GIP hoàn ≥ 50%)</span>
            </label>
            <button class="btn-primary" style="width:100%" onclick="handleRun('fillin')" ${runBusy ? "disabled" : ""}>
              ${runBusy ? "Đang gửi lệnh..." : "▶ Chạy FILL IN DATA ngay"}
            </button>
          `
          : `
            <div class="form-row">
              <div>
                <label class="field-label" for="gip287_mode">Chế độ chạy</label>
                <select id="gip287_mode">
                  <option value="apply" selected>Chạy thật (--apply)</option>
                  <option value="dry-run">Chỉ đọc kiểm tra (--dry-run)</option>
                </select>
              </div>
              <div>
                <label class="field-label" for="gip287_conc">Số tab kiểm tra song song</label>
                <select id="gip287_conc">
                  <option value="4" selected>4 tab (khuyên dùng)</option>
                  <option value="2">2 tab</option>
                  <option value="6">6 tab</option>
                </select>
              </div>
            </div>
            <label class="check-row">
              <input id="gip287_nocancel" type="checkbox" checked />
              <span><strong>Chỉ gắn tag, chưa hủy đơn</strong> (--no-cancel — tắt để tự hủy TEST / DUPLICATE)</span>
            </label>
            <button class="btn-primary" style="width:100%" onclick="handleRun('gip287')" ${runBusy ? "disabled" : ""}>
              ${runBusy ? "Đang gửi lệnh..." : "▶ Chạy GIP 287 ngay"}
            </button>
          `;

      const runsHtml =
        tool.runs && tool.runs.length
          ? tool.runs
              .map((r) => {
                const isRunning = r.status === "in_progress" || r.status === "queued" || r.status === "waiting";
                const trig = r.event === "schedule" ? "Lịch tự động" : "Bấm tay";
                const cancelBusy = Boolean(state.busyAction[`cancel_${r.id}`]);
                const artButtons = (r.artifacts || [])
                  .map(
                    (a) =>
                      `<a class="btn btn-ghost btn-xs" href="/api/artifact?id=${encodeURIComponent(a.id)}&name=${encodeURIComponent(a.name)}" target="_blank" rel="noopener">⬇ Tải Excel/Log</a>`
                  )
                  .join("");
                const stepBanner = r.currentStep
                  ? `<div class="step-hint">Đang ở bước: <strong>${escapeHtml(r.currentStep)}</strong></div>`
                  : "";
                return `
                  <div class="run-item">
                    <div class="run-top">
                      <div class="run-meta">
                        <strong style="color:var(--text);">#${r.runNumber}</strong>
                        <span>${escapeHtml(formatVnTime(r.startedAt || r.createdAt))}</span>
                        <span class="pill pill-slate">${trig}</span>
                        <span>${formatDuration(r.durationSec)}</span>
                      </div>
                      <div>${statusBadge(r)}</div>
                    </div>
                    ${stepBanner}
                    <div class="run-actions">
                      <button class="btn-ghost btn-xs" type="button" onclick="openLog(${r.id}, '${escapeHtml(tool.name)} #${r.runNumber}')">Xem Log</button>
                      ${artButtons}
                      ${
                        isRunning
                          ? `<button class="btn-danger btn-xs" type="button" onclick="handleCancel(${r.id})" ${cancelBusy ? "disabled" : ""}>■ Dừng phiên</button>`
                          : ""
                      }
                    </div>
                  </div>
                `;
              })
              .join("")
          : `<div style="color:var(--muted); font-size:13px;">Chưa có lịch sử chạy nào trên GitHub Actions.</div>`;

      return `
        <section class="card">
          <div class="card-head">
            <div>
              <div class="card-title-row">
                <h2>${escapeHtml(tool.name)}</h2>
                ${statusPill}
              </div>
              <div class="card-desc">${escapeHtml(tool.subtitle)}</div>
              <div class="sched-line">⏰ Lịch tự động: ${escapeHtml(tool.scheduleText)}</div>
            </div>
            <div>${toggleBtn}</div>
          </div>

          <div class="run-box">
            <div class="run-box-title">Chạy thủ công ngay</div>
            ${controlsHtml}
          </div>

          <div class="history-wrap">
            <div class="history-head">
              <h3>Tracking &amp; Lịch sử gần nhất</h3>
              <span style="font-size:12px; color:var(--muted);">${(tool.runs || []).length} lượt</span>
            </div>
            <div class="run-list">${runsHtml}</div>
          </div>
        </section>
      `;
    }

    function preserveDraftValues() {
      const fillSales = document.getElementById("fillin_sales")?.value;
      const fillMode = document.getElementById("fillin_mode")?.value;
      const fillSkip = document.getElementById("fillin_skip_step2")?.checked;
      const gipMode = document.getElementById("gip287_mode")?.value;
      const gipConc = document.getElementById("gip287_conc")?.value;
      const gipNoCancel = document.getElementById("gip287_nocancel")?.checked;
      return { fillSales, fillMode, fillSkip, gipMode, gipConc, gipNoCancel };
    }

    function restoreDraftValues(draft) {
      if (draft.fillSales !== undefined && document.getElementById("fillin_sales")) {
        document.getElementById("fillin_sales").value = draft.fillSales;
      }
      if (draft.fillMode !== undefined && document.getElementById("fillin_mode")) {
        document.getElementById("fillin_mode").value = draft.fillMode;
      }
      if (draft.fillSkip !== undefined && document.getElementById("fillin_skip_step2")) {
        document.getElementById("fillin_skip_step2").checked = draft.fillSkip;
      }
      if (draft.gipMode !== undefined && document.getElementById("gip287_mode")) {
        document.getElementById("gip287_mode").value = draft.gipMode;
      }
      if (draft.gipConc !== undefined && document.getElementById("gip287_conc")) {
        document.getElementById("gip287_conc").value = draft.gipConc;
      }
      if (draft.gipNoCancel !== undefined && document.getElementById("gip287_nocancel")) {
        document.getElementById("gip287_nocancel").checked = draft.gipNoCancel;
      }
    }

    function renderDashboard() {
      if (!state.data || !state.data.tools) return;
      const draft = preserveDraftValues();
      const grid = document.getElementById("cardsGrid");
      grid.innerHTML =
        renderToolCard(state.data.tools.fillin) +
        renderToolCard(state.data.tools.gip287);
      restoreDraftValues(draft);

      const allRuns = [
        ...(state.data.tools.fillin.runs || []),
        ...(state.data.tools.gip287.runs || []),
      ];
      const hasActive = allRuns.some((r) => r.status === "in_progress" || r.status === "queued");
      const intervalSec = hasActive ? 10 : 45;
      document.getElementById("refreshPill").textContent = hasActive
        ? "Đang chạy • cập nhật mỗi 10s"
        : "Tự cập nhật mỗi 45s";

      clearTimeout(state.refreshTimer);
      state.refreshTimer = setTimeout(loadStatus, intervalSec * 1000);
    }

    async function loadStatus() {
      if (state.loading) return;
      state.loading = true;
      const btn = document.getElementById("refreshBtn");
      btn.disabled = true;
      try {
        const res = await api("/api/status");
        state.data = res;
        renderDashboard();
      } catch (err) {
        if (err.message !== "Unauthorized") {
          showToast(err.message, "err");
        }
      } finally {
        state.loading = false;
        btn.disabled = false;
      }
    }

    window.setSales = function (val) {
      const el = document.getElementById("fillin_sales");
      if (el) el.value = val;
    };

    window.handleToggle = async function (toolId, nextEnabled) {
      const label = toolId === "fillin" ? "FILL IN DATA" : "GIP 287";
      const ok = window.confirm(
        `Bạn có chắc muốn ${nextEnabled ? "BẬT" : "TẮT"} lịch chạy tự động của ${label}?`
      );
      if (!ok) return;
      state.busyAction[`toggle_${toolId}`] = true;
      renderDashboard();
      try {
        const res = await api("/api/toggle", {
          method: "POST",
          body: JSON.stringify({ tool: toolId, enabled: nextEnabled }),
        });
        showToast(res.message, "ok");
        await loadStatus();
      } catch (err) {
        showToast(err.message, "err");
      } finally {
        state.busyAction[`toggle_${toolId}`] = false;
        renderDashboard();
      }
    };

    window.handleRun = async function (toolId) {
      let payload;
      if (toolId === "fillin") {
        payload = {
          tool: "fillin",
          mode: document.getElementById("fillin_mode").value,
          sales: document.getElementById("fillin_sales").value.trim(),
          skip_step2: document.getElementById("fillin_skip_step2").checked,
          concurrency: 4,
        };
      } else {
        payload = {
          tool: "gip287",
          mode: document.getElementById("gip287_mode").value,
          no_cancel: document.getElementById("gip287_nocancel").checked,
          concurrency: Number(document.getElementById("gip287_conc").value || 4),
        };
      }

      if (payload.mode === "apply") {
        const ok = window.confirm(
          `Xác nhận chạy THẬT (--apply) cho ${toolId === "fillin" ? "FILL IN DATA" : "GIP 287"}?`
        );
        if (!ok) return;
      }

      state.busyAction[`run_${toolId}`] = true;
      renderDashboard();
      try {
        const res = await api("/api/run", {
          method: "POST",
          body: JSON.stringify(payload),
        });
        showToast(res.message, "ok");
        setTimeout(loadStatus, 2500);
      } catch (err) {
        showToast(err.message, "err");
      } finally {
        state.busyAction[`run_${toolId}`] = false;
        renderDashboard();
      }
    };

    window.handleCancel = async function (runId) {
      if (!window.confirm(`Xác nhận dừng phiên chạy #${runId}?`)) return;
      state.busyAction[`cancel_${runId}`] = true;
      renderDashboard();
      try {
        const res = await api("/api/cancel", {
          method: "POST",
          body: JSON.stringify({ runId }),
        });
        showToast(res.message, "warn");
        setTimeout(loadStatus, 2000);
      } catch (err) {
        showToast(err.message, "err");
      } finally {
        state.busyAction[`cancel_${runId}`] = false;
        renderDashboard();
      }
    };

    window.openLog = async function (runId, title) {
      state.activeLogRunId = runId;
      state.activeLogTitle = title;
      document.getElementById("logModalTitle").textContent = `Log — ${title}`;
      document.getElementById("logPre").textContent = "Đang tải log từ server...";
      document.getElementById("logModal").classList.remove("hidden");
      try {
        const res = await api(`/api/logs?runId=${encodeURIComponent(runId)}`);
        document.getElementById("logPre").textContent =
          (res.lines && res.lines.length ? res.lines.join("\n") : "(Trống)");
      } catch (err) {
        document.getElementById("logPre").textContent = `Lỗi tải log: ${err.message}`;
      }
    };

    document.getElementById("closeLogBtn").onclick = () => {
      document.getElementById("logModal").classList.add("hidden");
    };
    document.getElementById("reloadLogBtn").onclick = () => {
      if (state.activeLogRunId) window.openLog(state.activeLogRunId, state.activeLogTitle);
    };
    document.getElementById("logModal").onclick = (e) => {
      if (e.target === e.currentTarget) document.getElementById("logModal").classList.add("hidden");
    };

    document.getElementById("refreshBtn").onclick = () => loadStatus();
    document.getElementById("logoutBtn").onclick = async () => {
      try { await api("/api/auth", { method: "DELETE" }); } catch {}
      switchToLogin();
    };

    document.getElementById("loginForm").onsubmit = async (e) => {
      e.preventDefault();
      const pw = document.getElementById("pwInput").value;
      const btn = document.getElementById("loginBtn");
      btn.disabled = true;
      try {
        await api("/api/auth", {
          method: "POST",
          body: JSON.stringify({ password: pw }),
        });
        document.getElementById("pwInput").value = "";
        document.getElementById("loginErr").classList.add("hidden");
        switchToApp();
        await loadStatus();
      } catch (err) {
        const errEl = document.getElementById("loginErr");
        errEl.textContent = err.message;
        errEl.classList.remove("hidden");
      } finally {
        btn.disabled = false;
      }
    };

    (async function boot() {
      updateClock();
      setInterval(updateClock, 1000);
      try {
        const info = await api("/api/auth");
        if (!info.configured && info.missingEnv && info.missingEnv.length) {
          const w = document.getElementById("envWarning");
          w.textContent = `Chưa cấu hình biến môi trường trên Vercel: ${info.missingEnv.join(", ")}`;
          w.classList.remove("hidden");
        }
        if (info.authenticated) {
          switchToApp();
          await loadStatus();
        }
      } catch (err) {
        switchToLogin(err.message);
      }
    })();
  </script>
</body>
</html>
